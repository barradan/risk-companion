<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https://appsforoffice.microsoft.com https://ajax.aspnetcdn.com;
             script-src 'self' 'unsafe-inline' https://appsforoffice.microsoft.com https://ajax.aspnetcdn.com;
             style-src 'self' 'unsafe-inline';
             img-src 'self' data: https:;
             connect-src 'self' https:;" />
  <title>Risk Companion</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div id="app" class="hidden">
    <header class="head">
      <span class="dot"></span>
      <h1>Risk prompts for this email</h1>
    </header>
    <p class="sub">Reminders only. Nothing here leaves your device. Tick one off to dismiss it for this email.</p>
    <div id="cards"></div>
    <p class="foot">Prompts are things to consider, not findings. They are not legal advice.</p>
  </div>
  <div id="loading" class="loading">Reading this email...</div>
  <script src="detectors.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
